name: Report a problem
description: Tell us what happened without private account details.
body:
  - type: input
    id: version
    attributes:
      label: MovieBox Android App version
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
      description: Do not include passwords, tokens, private links or personal library data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
