plugins { id 'com.android.application' }
android {
 namespace 'org.emransm.moviebox.phone'
 compileSdk 36
 defaultConfig { applicationId 'org.emransm.moviebox.phone'; minSdk 23; targetSdk 35; versionCode 7; versionName '0.1.4'; testInstrumentationRunner 'org.emransm.moviebox.phone.OwnedQaRunner' }
 buildFeatures { buildConfig true }
 if (System.getenv('MOVIEBOX_PHONE_KEYSTORE')) {
  signingConfigs { release {
   storeFile file(System.getenv('MOVIEBOX_PHONE_KEYSTORE'))
   storeType 'PKCS12'
   storePassword System.getenv('MOVIEBOX_PHONE_STORE_PASSWORD')
   keyAlias System.getenv('MOVIEBOX_PHONE_KEY_ALIAS')
   keyPassword System.getenv('MOVIEBOX_PHONE_KEY_PASSWORD')
  } }
  buildTypes { release { signingConfig signingConfigs.release } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.media3:media3-exoplayer:1.8.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
 implementation 'androidx.media3:media3-exoplayer-dash:1.8.1'
 implementation 'androidx.media3:media3-ui:1.8.1'
 implementation 'androidx.media3:media3-session:1.8.1'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
